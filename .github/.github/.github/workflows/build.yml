name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Один zip с проектом в корне репозитория
        run: |
          n=$(ls ./*.zip 2>/dev/null | wc -l)
          if [ "$n" -ne 1 ]; then echo "Нужен ровно один zip в корне, найдено: $n"; ls ./*.zip; exit 1; fi
      - run: unzip -q ./*.zip -d proj
      - name: Проверка эталона посева (WHEAT-SYNC)
        run: python3 proj/tools/wheat_sync_check.py
      - run: gradle assembleDebug --no-daemon
        working-directory: proj
      - uses: actions/upload-artifact@v4
        with:
          name: HayBot-apk
          path: proj/app/build/outputs/apk/debug/app-debug.apk
